[project]
name = "nsai"
version = "0.1.0"
description = "Neuro-symbolic AI agent CLI — LLM + RDF knowledge graph reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "rdflib>=7.0",
    "owlrl>=7.0",
    "python-constraint2>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "z3-solver>=4.13",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.10",
]

[project.optional-dependencies]
clang = ["libclang>=18"]

[project.scripts]
nsai = "nsai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nsai"]

# libclang stays out of dev on purpose: it is the optional `clang` extra
# (no wheels on some platforms), and the tests importorskip it. Develop the
# clang backend with: uv sync --dev --extra clang
[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
